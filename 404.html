<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found</title>
<link rel="canonical" href="/">
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 24px;
  background: #02040a;
  color: #f8fafc;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  text-align: center;
}
h1 { margin: 0; font-size: 22px; font-weight: 800; }
p { margin: 0; font-size: 14px; line-height: 1.6; color: #94a3b8; }
a {
  margin-top: 4px;
  padding: 10px 22px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  background: linear-gradient(135deg, #2997ff, #0071e3);
  color: #ffffff;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
}
</style>
<script>
// Send stale links to the live home page. The redirect runs at most once per
// session so a broken home page cannot cause a reload loop.
(function () {
  var flag = "pv-404-redirected";
  var already = false;
  try {
    already = window.sessionStorage.getItem(flag) === "1";
  } catch (error) {
    already = false;
  }
  if (already || window.location.pathname === "/") return;
  try {
    window.sessionStorage.setItem(flag, "1");
  } catch (error) {
    /* sessionStorage may be unavailable */
  }
  window.location.replace("/" + (window.location.hash || ""));
})();
</script>
</head>
<body>
<h1>Page not found</h1>
<p>You are being sent to the home page.</p>
<a href="/">Go to home page</a>
</body>
</html>
